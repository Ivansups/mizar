[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sigma-audit"
version = "0.1.0"
description = "Read-only security audit for Linux servers"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "mypy", "ruff"]

[project.scripts]
sigma-audit = "sigma_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py38"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# typing.List/Optional are kept on purpose: the runtime floor is Python 3.8
ignore = ["UP006", "UP007", "UP045"]

[tool.mypy]
strict = true
mypy_path = "src"
files = ["src", "tests"]
