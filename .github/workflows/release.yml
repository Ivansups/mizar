name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match the version in the code
        run: |
          version=$(python3 -c 'import re; print(re.search(r"__version__ = \"(.+?)\"", open("src/mizar/__init__.py").read()).group(1))')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match __version__ $version" >&2
            exit 1
          fi

      - name: Build
        run: sh scripts/build.sh

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/mizar

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/mizar dist/SHA256SUMS \
            --verify-tag --generate-notes --title "mizar ${GITHUB_REF_NAME#v}"
